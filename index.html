<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Geegle is a browser gaming platform with a large library of free web games, apps, and tools." />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Geegle" />
    <meta property="og:description" content="Free web games, apps, and tools in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:alt" content="Geegle game library" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geegle" />
    <meta name="twitter:description" content="Free web games, apps, and tools in your browser." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the persisted theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('geegle-theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage unavailable: fall back to light */
        }
      })();
    </script>
    <title>Geegle — Free Web Games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
