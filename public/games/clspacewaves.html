<!DOCTYPE html>
<!-- Space Waves — official do.Games Unity WebGL build, loaded from the
     same asset distribution (UGS-Assets) that serves the rest of the library.
     This launcher mirrors the game's own index.html loading code. The
     Microsoft Start ad SDK hooks are omitted because they only function on
     the MS Start platform; the game runs identically without them. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Waves</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }
    #unity-container { width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; }
    .centered {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #9ca3af; font-family: sans-serif; font-size: 14px;
    }
    .bar-empty {
      width: 240px; height: 6px; background: #374151;
      border-radius: 3px; overflow: hidden; margin-top: 12px;
    }
    .bar-full { height: 100%; width: 0%; background: #3b82f6; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading" class="centered">
    <div>Loading Space Waves…</div>
    <div class="bar-empty"><div id="bar" class="bar-full"></div></div>
  </div>

  <script>
    (function () {
      var CDN =
        'https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/space%20waves/';
      var canvas = document.getElementById('unity-canvas');
      var loading = document.getElementById('loading');
      var bar = document.getElementById('bar');

      var loaderUrl =
        CDN + 'Build/dae5c7bd2b15915f51ae4e56b8f5367d.loader.js';
      var config = {
        dataUrl:
          CDN + 'Build/568ea6b3af616bd57f419c508c933303.data.unityweb',
        frameworkUrl:
          CDN + 'Build/c699bc4c24abfbdb4c8b3e15b0af7d3f.framework.js.unityweb',
        codeUrl:
          CDN + 'Build/7fb5141de5923189bc1dc5f94eb619f2.wasm.unityweb',
        companyName: 'do.Games',
        productName: 'Space Waves',
        productVersion: '1.1.2',
        matchWebGLToCanvasSize: false,
      };

      var script = document.createElement('script');
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          bar.style.width = 100 * progress + '%';
        }).then(function (unityInstance) {
          loading.style.display = 'none';
          resizeCanvas();
        }).catch(function (message) {
          loading.textContent = 'Failed to load: ' + message;
        });
      };
      document.body.appendChild(script);

      function resizeCanvas() {
        var pixelRatio = window.devicePixelRatio || 1;
        var width = canvas.clientWidth * pixelRatio;
        var height = canvas.clientHeight * pixelRatio;
        if (canvas.width !== width || canvas.height !== height) {
          if (height > 1080) {
            canvas.width = Math.floor((width / height) * 1080);
            canvas.height = 1080;
          } else {
            canvas.width = width;
            canvas.height = height;
          }
        }
      }

      window.addEventListener('resize', resizeCanvas);
    })();
  </script>
</body>
</html>
