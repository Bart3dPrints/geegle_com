<!DOCTYPE html>
<!-- Everythingle integration: frames the site directly with the destination
     pre-supplied (everythingle.com home), keeping the Geegle player chrome
     (Back / Reload / Fullscreen) around it. The site's own terms permit free
     personal use and normal linking; no security headers are stripped and no
     Geegle credentials are passed. If the site refuses to be framed, the
     wrapper offers an open-in-new-tab fallback after a timeout. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everythingle</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a14; overflow: hidden; font-family: system-ui, sans-serif; }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #fallback { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 100%; color: #dbeafe; text-align: center; padding: 24px; box-sizing: border-box; }
  #fallback a, #fallback button { padding: 10px 18px; border-radius: 6px; border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
  #fallback .secondary { background: #0b1c33; border-color: #1e3a5f; }
</style>
</head>
<body>
<iframe id="frame" title="Everythingle" src="https://everythingle.com/" allow="fullscreen"></iframe>
<div id="fallback">
  <p>Everythingle could not display inside Geegle.</p>
  <p style="font-size:13px;color:#7fa8d0">Open it directly, then come back here when you're done.</p>
  <a href="https://everythingle.com/" target="_blank" rel="noopener">Open Everythingle</a>
  <button class="secondary" onclick="retry()">Retry</button>
</div>
<script>
(function () {
  var DEST = 'https://everythingle.com/';
  var frame = document.getElementById('frame');
  var fallback = document.getElementById('fallback');
  var loaded = false;

  frame.addEventListener('load', function () { loaded = true; fallback.style.display = 'none'; });

  // If the site sends X-Frame-Options / CSP frame-ancestors, the load event
  // never fires; surface the fallback instead of a blank screen.
  var timer = setTimeout(function () {
    if (!loaded) fallback.style.display = 'flex';
  }, 8000);

  window.retry = function () {
    loaded = false;
    fallback.style.display = 'none';
    clearTimeout(timer);
    frame.src = DEST;
    timer = setTimeout(function () { if (!loaded) fallback.style.display = 'flex'; }, 8000);
  };
})();
</script>
</body>
</html>
