<!DOCTYPE html>
<html lang="en">
<head><script src="/games/geegle-storage-shim.js" data-geegle-storage data-game="clkrillion"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krillion</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a14; font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #krillion-frame { width: 100%; height: 100%; border: 0; display: block; }
  /* Compact mode switch overlays the game instead of pushing it down. */
  #bar { position: fixed; top: 8px; right: 8px; z-index: 2; display: flex; gap: 6px; padding: 3px; border-radius: 8px; background: #0b1c33cc; backdrop-filter: blur(4px); }
  .btn { padding: 6px 12px; border: 1px solid #1e3a5f; border-radius: 5px; background: #0b1c33; color: #dbeafe; font-size: 12px; cursor: pointer; }
  .btn[aria-pressed="true"] { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  #status { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 2; margin: 0; color: #7fa8d0; font-size: 11px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="krillion-frame" title="Krillion" src="https://krillion.cc/embed/?mode=daily" allow="fullscreen" loading="eager"></iframe>
</div>
<div id="bar">
  <button class="btn" data-mode="daily" aria-pressed="true">Daily</button>
  <button class="btn" data-mode="unlimited" aria-pressed="false">Unlimited</button>
</div>
<p id="status">Loading Krillion…</p>
<script>
(function () {
  'use strict';
  var ORIGIN = 'https://krillion.cc';
  var frame = document.getElementById('krillion-frame');
  var status = document.getElementById('status');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-mode]'));

  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      frame.src = ORIGIN + '/embed/?mode=' + encodeURIComponent(button.dataset.mode);
      status.textContent = 'Loading ' + button.dataset.mode + '…';
    });
  });

  // Documented postMessage contract: source, type, and per-type payloads.
  window.addEventListener('message', function (event) {
    if (event.origin !== ORIGIN) return;
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.source !== 'krillion' || typeof data.type !== 'string') return;
    switch (data.type) {
      case 'ready': status.textContent = 'Krillion ready'; break;
      case 'start': status.textContent = 'Dive started (' + String(data.mode) + ')'; break;
      case 'resize':
        // The game fills the player exactly; reported heights do not move it.
        break;
      case 'answer':
        if (Number.isFinite(data.points)) {
          status.textContent = 'Answer: ' + data.points + ' pts';
        }
        break;
      case 'complete':
        if (Number.isFinite(data.points) && Number.isFinite(data.metres)) {
          status.textContent = 'Dive complete: ' + data.points + ' pts, ' + data.metres + ' m';
          try {
            localStorage.setItem('krillion-results', JSON.stringify({
              timestamp: Date.now(), points: data.points,
              maxPoints: data.maxPoints, metres: data.metres, zone: data.zone
            }));
          } catch (e) { /* storage unavailable */ }
        }
        break;
    }
  });
})();
</script>
</body>
</html>
