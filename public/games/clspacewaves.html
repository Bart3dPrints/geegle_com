<!DOCTYPE html>
<!-- Space Waves: loads the game's own Unity WebGL build from the same
     asset distribution (UGS-Assets) that serves the rest of the library.
     The game entry previously pointed here but no launcher existed. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Waves</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    #gameContainer { width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/space%20waves/">
</head>
<body>
  <div id="gameContainer"></div>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/spacewaves.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () {
          UnityProgress(gameInstance, "complete");
        }
      }
    });
  </script>
</body>
</html>
